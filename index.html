<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-bridge.png" />
    <link rel="apple-touch-icon"    href="/logo-bridge.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bridge HUB — Motor de Lançamentos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Aplica o tema salvo antes do primeiro paint. Sem isto, quem escolheu
      // escuro vê um flash branco enquanto o React monta.
      try {
        var t = localStorage.getItem('bridge:theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
